# Default values for payment.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

deploymentName: payment-deployment
serviceName: payment-service
appLabel: payment

replicaCount: 1

image:
  repository: payment
  tag: v1

containerPort: 8080

otelEnabled: true

service:
  port: 8080
  targetPort: 8080
  type: ClusterIP

serviceType: command

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: true
  targetMemoryUtilizationPercentage: true
  resource:
    cpu:
      averageUtilization: 70
    memory:
      averageUtilization: 70

extraEnv:
  - name: POSTGRES_COMMAND_HOST
    value: <check>
  - name: POSTGRES_COMMAND_PORT
    value: <check>