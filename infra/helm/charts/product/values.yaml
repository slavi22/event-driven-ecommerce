# Default values for product.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

deploymentName: product-deployment
serviceName: product-service
appLabel: product

replicaCount: 1

image:
  repository: product
  tag: v1

containerPort: 8080

otelEnabled: true

service:
  port: 8080
  targetPort: 8080
  type: ClusterIP

serviceType: command

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: true
  targetMemoryUtilizationPercentage: true
  resource:
    cpu:
      averageUtilization: 70
    memory:
      averageUtilization: 70

extraEnv:
  - name: POSTGRES_COMMAND_HOST
    value: <check>
  - name: POSTGRES_COMMAND_PORT
    value: <check>
  - name: GATEWAY_URL
    value: <check>