    container_name: projection-db
    environment:
      - POSTGRES_DB=projection
      - POSTGRES_USER=${POSTGRES_PROJECTION_DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PROJECTION_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./projection-db-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_COMMAND_DB_USER} -d projection" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - services_network

  ### services

  api-gateway:
    build:
      context: ../e-commerce-platform
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - RESOURCE_SERVER_ISSUER_URI=${RESOURCE_SERVER_ISSUER_URI}
      - RESOURCE_SERVER_JWK_SET_URI=${RESOURCE_SERVER_JWK_SET_URI}
      - OAUTH2_CLIENT_ID=${OAUTH2_CLIENT_ID}
      - KEYCLOAK_AUTH_SERVER_URL=${KEYCLOAK_AUTH_SERVER_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - GATEWAY_URL=${GATEWAY_URL}
      # OTel
      - JAVA_TOOL_OPTIONS=-javaagent:/app/libs/opentelemetry-javaagent.jar
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      keycloak:
        condition: service_started
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
    networks:
      - services_network
      - keycloak_network
      - kafka_network
      - monitoring_network
      - loki_network

  product:
    build:
      context: ../e-commerce-platform
      dockerfile: product/Dockerfile
    container_name: product
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_COMMAND_USER=${POSTGRES_COMMAND_DB_USER}
