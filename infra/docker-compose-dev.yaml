# gateway => https://medium.com/@gauravraisinghani1998/implementing-spring-cloud-gateway-a-comprehensive-guide-3498aaacfdca

# keycloak => https://medium.com/@iaravinda33/integrating-keycloak-authentication-with-spring-boot-a-complete-guide-98df2c8d244a
services:
  keycloak_db:
    image: postgres:18.3
    container_name: keycloak-db
    volumes:
      - ./keycloak_data:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KEYCLOAK_POSTGRES_USER}
      - POSTGRES_PASSWORD=${KEYCLOAK_POSTGRES_PASSWORD}
    networks:
      - keycloak_network

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=${KEYCLOAK_POSTGRES_USER}
      - KC_DB_PASSWORD=${KEYCLOAK_POSTGRES_PASSWORD}
    ports:
      - "8000:8080"
    depends_on:
      - keycloak_db
    command: 'start-dev'
    networks:
      - keycloak_network

  kafka-broker-1:
    image: apache/kafka:4.2.0
    container_name: kafka-broker-1
    ports:
      - "9094:9094" # External listener for access from outside the docker network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-1:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: oHEo8RY0S6OV-Rzlputyeg
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - ./kafka-broker-1/data:/tmp/kafka-logs
    networks:
      - kafka_network


  kafka-broker-2:
    image: apache/kafka:4.2.0
    container_name: kafka-broker-2
    ports:
      - "9095:9094" # External listener for access from outside the docker network
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-2:9092,EXTERNAL://localhost:9095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: oHEo8RY0S6OV-Rzlputyeg
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - ./kafka-broker-2/data:/tmp/kafka-logs
    networks:
      - kafka_network

  kafka-broker-3:
    image: apache/kafka:4.2.0
    container_name: kafka-broker-3
    ports:
      - "9096:9094" # External listener for access from outside the docker network
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-3:9092,EXTERNAL://localhost:9096
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: oHEo8RY0S6OV-Rzlputyeg
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - ./kafka-broker-3/data:/tmp/kafka-logs
    networks:
      - kafka_network

  ### infrastructure

  command-db:
    image: postgres:18.3
    container_name: command-db
    environment:
      - POSTGRES_DB=command
      - POSTGRES_USER=${COMMAND_DB_USER}
      - POSTGRES_PASSWORD=${COMMAND_DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${COMMAND_DB_USER} -d command" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - services_network

  query-db:
    image: postgres:18.3
    container_name: query-db
    environment:
      - POSTGRES_DB=query
      - POSTGRES_USER=${QUERY_DB_USER}
      - POSTGRES_PASSWORD=${QUERY_DB_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${QUERY_DB_USER} -d query" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - services_network

  ### services

  product:
    build:
      context: ../e-commerce-platform
      dockerfile: product/Dockerfile
    container_name: product
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_COMMAND_USER=${COMMAND_DB_USER}
      - POSTGRES_COMMAND_PASSWORD=${COMMAND_DB_PASSWORD}
      - POSTGRES_QUERY_USER=${QUERY_DB_USER}
      - POSTGRES_QUERY_PASSWORD=${QUERY_DB_PASSWORD}
    depends_on:
      command-db:
        condition: service_healthy
      query-db:
        condition: service_healthy
      kafka-broker-1:
        condition: service_started
    networks:
      - services_network
      - kafka_network

networks:
  keycloak_network:
    driver: bridge

  kafka_network:
    driver: bridge

  services_network:
    driver: bridge

