spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
  main:
    allow-bean-definition-overriding: true
  datasource:
    command:
      liquibase:
        enabled: false
    query:
      liquibase:
        enabled: false

app:
  scheduling:
    enabled: false