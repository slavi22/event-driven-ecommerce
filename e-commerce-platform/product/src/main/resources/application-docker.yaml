spring:
  datasource:
    command:
      jdbc-url: jdbc:postgresql://command-db:5432/command?currentSchema=product
      username: ${POSTGRES_COMMAND_USER}
      password: ${POSTGRES_COMMAND_PASSWORD}
      driver-class-name: org.postgresql.Driver
      liquibase:
        change-log: classpath:db/db.command.changelog-master.yaml
    query:
      jdbc-url: jdbc:postgresql://query-db:5432/query?currentSchema=product
      username: ${POSTGRES_QUERY_USER}
      password: ${POSTGRES_QUERY_PASSWORD}
      driver-class-name: org.postgresql.Driver
      liquibase:
        change-log: classpath:db/db.query.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  kafka:
    bootstrap-servers: kafka-broker-1:9092

app:
  scheduling:
    product: 10000
